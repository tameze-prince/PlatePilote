name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  android-release:
    name: Verify and build signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: FrontEnd
    env:
      PLATEPILOT_API_BASE_URL: ${{ vars.PLATEPILOT_API_BASE_URL }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      FIREBASE_ANDROID_API_KEY: ${{ vars.FIREBASE_ANDROID_API_KEY }}
      FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      GOOGLE_OAUTH_SERVER_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_SERVER_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PLATEPILOT_API_BASE_URL" ]] || { echo "Missing repository variable PLATEPILOT_API_BASE_URL"; exit 1; }
          [[ "$PLATEPILOT_API_BASE_URL" == https://* ]] || { echo "Release API URL must use HTTPS"; exit 1; }
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || { echo "Missing secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || { echo "Missing secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || { echo "Missing secret ANDROID_KEY_PASSWORD"; exit 1; }
          [[ -n "$ANDROID_KEY_ALIAS" ]] || { echo "Missing secret ANDROID_KEY_ALIAS"; exit 1; }

          firebase_values=(
            "$FIREBASE_ANDROID_API_KEY"
            "$FIREBASE_ANDROID_APP_ID"
            "$FIREBASE_MESSAGING_SENDER_ID"
            "$FIREBASE_PROJECT_ID"
          )
          configured=0
          for value in "${firebase_values[@]}"; do
            [[ -n "$value" ]] && ((configured += 1)) || true
          done
          if [[ "$configured" -ne 0 && "$configured" -ne 4 ]]; then
            echo "Firebase must be configured with all four repository variables or left entirely unset."
            exit 1
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test --no-pub

      - name: Configure Android upload signing
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=../upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          EOF
          chmod 600 android/upload-keystore.jks android/key.properties

      - name: Resolve Android version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0.0" >> "$GITHUB_OUTPUT"
          fi
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build signed APKs
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}" \
            --dart-define=PLATEPILOT_API_BASE_URL="$PLATEPILOT_API_BASE_URL" \
            --dart-define=FIREBASE_ANDROID_API_KEY="$FIREBASE_ANDROID_API_KEY" \
            --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=GOOGLE_OAUTH_SERVER_CLIENT_ID="$GOOGLE_OAUTH_SERVER_CLIENT_ID"

      - name: Build signed Android App Bundle
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}" \
            --dart-define=PLATEPILOT_API_BASE_URL="$PLATEPILOT_API_BASE_URL" \
            --dart-define=FIREBASE_ANDROID_API_KEY="$FIREBASE_ANDROID_API_KEY" \
            --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=GOOGLE_OAUTH_SERVER_CLIENT_ID="$GOOGLE_OAUTH_SERVER_CLIENT_ID"

      - name: Verify signatures and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            "$APKSIGNER" verify --verbose "$apk"
          done
          sha256sum build/app/outputs/flutter-apk/*.apk build/app/outputs/bundle/release/*.aab > build/app/outputs/SHA256SUMS.txt

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: platepilote-android-release-${{ github.ref_name }}
          path: |
            FrontEnd/build/app/outputs/flutter-apk/*.apk
            FrontEnd/build/app/outputs/bundle/release/*.aab
            FrontEnd/build/app/outputs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
