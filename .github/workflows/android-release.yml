name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  android-release:
    name: Verify and build signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: FrontEnd
    env:
      PLATEPILOT_API_BASE_URL: ${{ vars.PLATEPILOT_API_BASE_URL }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PLATEPILOT_API_BASE_URL" ]] || { echo "Missing repository variable PLATEPILOT_API_BASE_URL"; exit 1; }
          [[ "$PLATEPILOT_API_BASE_URL" == https://* ]] || { echo "Release API URL must use HTTPS"; exit 1; }
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || { echo "Missing secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || { echo "Missing secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || { echo "Missing secret ANDROID_KEY_PASSWORD"; exit 1; }
          [[ -n "$ANDROID_KEY_ALIAS" ]] || { echo "Missing secret ANDROID_KEY_ALIAS"; exit 1; }

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test --no-pub

      - name: Configure Android upload signing
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=../upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          EOF
          chmod 600 android/upload-keystore.jks android/key.properties

      - name: Build signed APKs
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=PLATEPILOT_API_BASE_URL="$PLATEPILOT_API_BASE_URL"

      - name: Build signed Android App Bundle
        run: |
          flutter build appbundle --release \
            --dart-define=PLATEPILOT_API_BASE_URL="$PLATEPILOT_API_BASE_URL"

      - name: Verify signatures and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            "$APKSIGNER" verify --verbose "$apk"
          done
          sha256sum build/app/outputs/flutter-apk/*.apk build/app/outputs/bundle/release/*.aab > build/app/outputs/SHA256SUMS.txt

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: platepilote-android-release-${{ github.ref_name }}
          path: |
            FrontEnd/build/app/outputs/flutter-apk/*.apk
            FrontEnd/build/app/outputs/bundle/release/*.aab
            FrontEnd/build/app/outputs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
