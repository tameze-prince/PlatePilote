name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Annule les exécutions précédentes sur la même branche/ref pour économiser les 2000 min/mois
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: "-Xmx1g -XX:MaxRAMPercentage=70"

jobs:
  build:
    name: Compile + Test (JDK 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BackEnd

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin, Maven cache)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'eclipse-temurin'
          cache: maven
          cache-dependency-path: BackEnd/pom.xml

      - name: Validate Maven wrapper & POM
        run: ./mvnw -v

      - name: Compile + run unit/integration tests
        run: ./mvnw -B verify

      - name: Upload JAR (build artifact)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: platepilote-backend-jar
          path: BackEnd/target/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload Surefire test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ github.run_id }}
          path: BackEnd/target/surefire-reports/
          retention-days: 14

      - name: Publish Test Report summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Maven Test Report
          path: BackEnd/target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

  docker-smoke:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Ne push PAS l'image — juste vérifier que le Dockerfile build (Railway/Render rebuildent eux-mêmes)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: BackEnd
          push: false
          tags: platepilote-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
