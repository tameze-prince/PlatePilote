name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: BackEnd (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: BackEnd/pom.xml

      - name: Lint (compile) BackEnd
        working-directory: BackEnd
        run: mvn -B compile

      - name: Tests BackEnd
        working-directory: BackEnd
        run: mvn -B test -DfailIfNoTests=false -Dtest='!*IT,!*IntegrationTest'
        env:
          # Secrets à définir dans GitHub repo settings si utilisés par les tests
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}

      - name: Backend status
        if: always()
        run: |
          echo "### Backend CI" >> $GITHUB_STEP_SUMMARY
          echo "Result: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  frontend:
    name: FrontEnd (Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.x'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (lint) FrontEnd
        run: flutter analyze lib

      - name: Tests FrontEnd
        run: flutter test test

      - name: Frontend status
        if: always()
        run: |
          echo "### Frontend CI" >> $GITHUB_STEP_SUMMARY
          echo "Result: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  summary:
    name: CI Summary
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Print overall status
        run: |
          echo "## PlatePilot CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ${{ needs.backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ needs.frontend.result }}" >> $GITHUB_STEP_SUMMARY
