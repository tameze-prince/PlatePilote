name: Mobile CI (Flutter)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'FrontEnd/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main, release/production-readiness]
    paths:
      - 'FrontEnd/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: write

defaults:
  run:
    working-directory: FrontEnd

jobs:
  flutter-ci:
    name: Flutter CI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files and print formatter diff (temporary)
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          BASE_SHA="$(git merge-base origin/main HEAD)"

          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Unable to determine a valid base commit for the Dart formatting check."
            exit 1
          fi

          changed_dart_files="$(git diff --name-only "$BASE_SHA...HEAD" -- '*.dart')"
          dart_files=()
          while IFS= read -r path; do
            if [[ "$path" == FrontEnd/*.dart ]]; then
              dart_files+=("${path#FrontEnd/}")
            fi
          done <<< "$changed_dart_files"

          if [ "${#dart_files[@]}" -eq 0 ]; then
            echo "No changed Dart files to format-check."
          else
            dart format "${dart_files[@]}"
            git --no-pager diff -- .
          fi
      - name: Commit formatted Dart sources and resolved lockfile (temporary)
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/production-readiness'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed_files=$(git status --short --untracked-files=no | awk '{print $2}' | grep -E '^FrontEnd/.*\.dart$|^FrontEnd/pubspec\.lock
        run: flutter analyze

      - name: Run unit tests with coverage
        run: flutter test --no-pub --coverage

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          directory: FrontEnd/coverage
          flags: flutter
          fail_ci_if_error: false

      - name: Build debug APKs (split per ABI)
        run: flutter build apk --debug --split-per-abi

      - name: List APK artifacts
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk-debug
          path: FrontEnd/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 14

  integration-tests:
    name: Flutter integration tests (Android emulator)
    needs: flutter-ci
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: FrontEnd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd FrontEnd
            flutter test integration_test/ -d emulator-5554 --dart-define=PLATEPILOT_API_BASE_URL=http://127.0.0.1:9
 || true)
          if [ -n "$changed_files" ]; then
            git add -- $changed_files
            if ! git diff --cached --quiet; then
              git commit -m "style(mobile): format Flutter sources and lock dependencies"
              git push origin HEAD:release/production-readiness
            fi
          fi
      - name: Static analysis
        run: flutter analyze

      - name: Run unit tests with coverage
        run: flutter test --no-pub --coverage

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          directory: FrontEnd/coverage
          flags: flutter
          fail_ci_if_error: false

      - name: Build debug APKs (split per ABI)
        run: flutter build apk --debug --split-per-abi

      - name: List APK artifacts
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk-debug
          path: FrontEnd/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 14

  integration-tests:
    name: Flutter integration tests (Android emulator)
    needs: flutter-ci
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: FrontEnd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd FrontEnd
            flutter test integration_test/ -d emulator-5554 --dart-define=PLATEPILOT_API_BASE_URL=http://127.0.0.1:9
