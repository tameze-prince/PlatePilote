name: Mobile CI (Flutter)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'FrontEnd/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'FrontEnd/**'
      - '.github/workflows/mobile-ci.yml'

defaults:
  run:
    working-directory: FrontEnd

jobs:
  flutter-ci:
    name: Flutter CI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting of changed Dart files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          mapfile -t dart_files < <(git diff --name-only "$BASE_SHA...HEAD" -- '*.dart' | sed -n 's#^FrontEnd/##p')
          if [ "${#dart_files[@]}" -eq 0 ]; then
            echo "No changed Dart files to format-check."
          else
            dart format --output=none --set-exit-if-changed "${dart_files[@]}"
          fi

      - name: Static analysis
        run: flutter analyze

      - name: Run unit tests with coverage
        run: flutter test --no-pub --coverage

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          directory: FrontEnd/coverage
          flags: flutter
          fail_ci_if_error: false

      - name: Build debug APKs (split per ABI)
        run: flutter build apk --debug --split-per-abi

      - name: List APK artifacts
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk-debug
          path: FrontEnd/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 14

  integration-tests:
    name: Flutter integration tests (Android emulator)
    needs: flutter-ci
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: FrontEnd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd FrontEnd
            flutter test integration_test/ -d emulator-5554 --dart-define=PLATEPILOT_API_BASE_URL=http://127.0.0.1:9
