name: Mobile CI (Flutter)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'FrontEnd/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main, release/production-readiness]
    paths:
      - 'FrontEnd/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: write

defaults:
  run:
    working-directory: FrontEnd

jobs:
  flutter-ci:
    name: Flutter CI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Patch generated localization delegates for standalone Material UI
        run: python3 tool/patch_generated_localizations.py

      - name: Regenerate Freezed and JSON serialization sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format changed Dart files (temporary)
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          BASE_SHA="$(git merge-base origin/main HEAD)"
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Unable to determine a valid base commit for the Dart formatting check."
            exit 1
          fi
          changed_dart_files="$(git diff --name-only "$BASE_SHA...HEAD" -- '*.dart')"
          dart_files=()
          while IFS= read -r path; do
            if [[ "$path" == FrontEnd/*.dart ]]; then
              dart_files+=("${path#FrontEnd/}")
            fi
          done <<< "$changed_dart_files"
          if [ "${#dart_files[@]}" -gt 0 ]; then
            dart format "${dart_files[@]}"
          fi
      - name: Commit formatted Dart sources and resolved lockfile (temporary)
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/production-readiness'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.dart' 'pubspec.lock'
          if ! git diff --cached --quiet; then
            git commit -m "style(mobile): format Flutter sources and lock dependencies"
            git push origin HEAD:release/production-readiness
          fi
      - name: Static analysis
        run: flutter analyze

      - name: Run unit tests with coverage
        run: flutter test --no-pub --coverage

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          directory: FrontEnd/coverage
          flags: flutter
          fail_ci_if_error: false

      - name: Set up Java 17 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate debug API configuration
        env:
          PLATEPILOT_API_BASE_URL: ${{ vars.PLATEPILOT_API_BASE_URL || 'http://127.0.0.1:9' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          value = os.environ.get("PLATEPILOT_API_BASE_URL", "").strip()
          parsed = urlparse(value)
          if parsed.scheme not in {"http", "https"} or not parsed.netloc:
              raise SystemExit("PLATEPILOT_API_BASE_URL must be configured as an absolute HTTP(S) URL.")
          PY

      - name: Build debug APKs (split per ABI)
        env:
          PLATEPILOT_API_BASE_URL: ${{ vars.PLATEPILOT_API_BASE_URL }}
          FIREBASE_ANDROID_API_KEY: ${{ vars.FIREBASE_ANDROID_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          GOOGLE_OAUTH_SERVER_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_SERVER_CLIENT_ID }}
        run: |
          flutter build apk --debug --split-per-abi \
            --dart-define=PLATEPILOT_API_BASE_URL="$PLATEPILOT_API_BASE_URL" \
            --dart-define=FIREBASE_ANDROID_API_KEY="$FIREBASE_ANDROID_API_KEY" \
            --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=GOOGLE_OAUTH_SERVER_CLIENT_ID="$GOOGLE_OAUTH_SERVER_CLIENT_ID"

      - name: List APK artifacts
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK artifacts
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/production-readiness')
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk-debug-${{ github.run_id }}
          path: FrontEnd/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 14

  integration-tests:
    name: Flutter integration tests (Android emulator)
    needs: flutter-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: FrontEnd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable KVM permissions for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            cd FrontEnd
            flutter test integration_test/ -d emulator-5554 --dart-define=PLATEPILOT_API_BASE_URL=http://127.0.0.1:9
