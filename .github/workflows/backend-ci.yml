name: Backend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: platepilote-backend
  REGISTRY: ghcr.io
  REGISTRY_IMAGE: ghcr.io/tamez-prince/platepilote-backend

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BackEnd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'eclipse-temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean verify -DskipTests=false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: BackEnd/target/surefire-reports/

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'eclipse-temurin'
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests -q

      - name: Extract JAR filename
        id: jar_info
        run: |
          JAR_FILE=$(ls target/*.jar | head -n1 | xargs basename)
          echo "jar_file=$JAR_FILE" >> $GITHUB_OUTPUT
        working-directory: BackEnd

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push with Docker
        uses: docker/build-push-action@v5
        with:
          context: BackEnd
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:latest
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.platepilote.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull Docker image on EC2 via SSM
        uses: aws-actions/aws-ssm-parameter-store@v1
        with:
          parameter-name: PLATEPILOTE_EC2_HOST
          region: ${{ secrets.AWS_REGION }}

      - name: Deploy to EC2
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
          EC2_USER: ${{ secrets.AWS_EC2_USER }}
        run: |
          # Build and push to ECR
          docker tag ${{ env.REGISTRY_IMAGE }}:latest ${{ steps.login-ecr.outputs.registry }}/platepilote-backend:latest
          docker tag ${{ env.REGISTRY_IMAGE }}:latest ${{ steps.login-ecr.outputs.registry }}/platepilote-backend:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/platepilote-backend:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/platepilote-backend:${{ github.sha }}

          # SSH into EC2 and deploy
          chmod 600 ~/.ssh/github_actions_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/github_actions_key ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }} << 'EOF'
            set -e
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            docker pull ${{ steps.login-ecr.outputs.registry }}/platepilote-backend:latest
            docker stop platepilote-backend || true
            docker rm platepilote-backend || true
            docker run -d \
              --name platepilote-backend \
              --restart always \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e DB_URL=$DB_URL \
              -e DB_USERNAME=$DB_USERNAME \
              -e DB_PASSWORD=$DB_PASSWORD \
              -e JWT_SECRET=$JWT_SECRET \
              -e STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY \
              ${{ steps.login-ecr.outputs.registry }}/platepilote-backend:latest
            docker image prune -f
          EOF
        continue-on-error: true

      - name: Health check after deploy
        run: |
          sleep 15
          curl -f https://${{ secrets.AWS_EC2_HOST }}/actuator/health || exit 1
        continue-on-error: true

      - name: Notify deployment
        run: |
          echo "Deployment triggered for ${{ github.sha }} to AWS EC2"
        continue-on-error: true

# ══════════════════════════════════════════════════════════════
# SECRETS À CONFIGURER DANS GITHUB REPO → Settings → Secrets:
# ──────────────────────────────────────────────────────────────
# AWS_ACCESS_KEY_ID       : Clé d'accès IAM (role EC2Deploy)
# AWS_SECRET_ACCESS_KEY  : Clé secrète IAM
# AWS_REGION             : Region AWS (ex: eu-west-3 pour Paris)
# AWS_EC2_HOST           : IP publique ou DNS de l'instance EC2
# AWS_EC2_USER           : Utilisateur SSH (ec2-user ou ubuntu)
# DB_URL                 : JDBC URL PostgreSQL Neon
# DB_USERNAME            : Username PostgreSQL
# DB_PASSWORD            : Password PostgreSQL
# JWT_SECRET             : Secret pour signer les JWT
# STRIPE_SECRET_KEY      : Clé secrète Stripe
# ══════════════════════════════════════════════════════════════