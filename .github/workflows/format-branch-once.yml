name: Temporary Dart format inspection

on:
  push:
    branches:
      - release/production-readiness
    paths:
      - .github/workflows/format-branch-once.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/production-readiness
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Print formatted notification service
        working-directory: FrontEnd
        run: dart format --output=show lib/core/notifications/notification_service.dart
