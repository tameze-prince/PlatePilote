name: One-time Dart formatter

on:
  push:
    branches:
      - release/production-readiness
    paths:
      - .github/workflows/format-branch-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/production-readiness
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format modified Dart sources
        working-directory: FrontEnd
        run: |
          dart format \
            lib/core/network/api_client.dart \
            lib/main.dart \
            lib/firebase_options.dart \
            lib/core/notifications/push_notification_service.dart \
            lib/core/providers/app_session_provider.dart \
            lib/features/notifications/notification_preferences_screen.dart \
            lib/app/app.dart \
            lib/features/auth/providers/auth_provider.dart \
            lib/features/settings/settings_screen.dart

      - name: Commit formatting changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FrontEnd/lib
          if git diff --cached --quiet; then
            echo "Targeted Dart sources are already formatted."
            exit 0
          fi
          git commit -m "style(front): format release readiness changes"
          git push origin HEAD:release/production-readiness
