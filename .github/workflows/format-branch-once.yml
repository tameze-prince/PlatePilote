name: One-time Dart formatter (final branch pass)

on:
  push:
    branches:
      - release/production-readiness
    paths:
      - .github/workflows/format-branch-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/production-readiness
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format the files reported by CI
        working-directory: FrontEnd
        run: |
          dart format \
            lib/core/network/api_client.dart \
            lib/core/repositories/auth_repository.dart \
            lib/core/repositories/recipe_repository.dart \
            lib/features/recipe/recipe_details_screen.dart

      - name: Commit formatting changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            FrontEnd/lib/core/network/api_client.dart \
            FrontEnd/lib/core/repositories/auth_repository.dart \
            FrontEnd/lib/core/repositories/recipe_repository.dart \
            FrontEnd/lib/features/recipe/recipe_details_screen.dart
          if git diff --cached --quiet; then
            echo "All targeted files are already formatted."
            exit 0
          fi
          git commit -m "style(front): format Dart files flagged by CI"
          git push origin HEAD:release/production-readiness
