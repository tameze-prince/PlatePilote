<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- Rounded square background (matches PlatePilote app icon container) -->
  <rect x="40" y="40" width="920" height="920" rx="180" ry="180" fill="#FFFFFF"/>

  <!-- PlatePilote icon : 4 arcs (2 bleus top + 2 verts bottom) + sprout centrale -->
  <g transform="translate(500 500)">
    <!-- Top-left blue arc -->
    <path d="M -300 0 A 300 300 0 0 1 -3 -300" fill="none" stroke="#4A90E2" stroke-width="40" stroke-linecap="round"/>
    <!-- Top-right blue arc -->
    <path d="M 3 -300 A 300 300 0 0 1 300 0" fill="none" stroke="#4A90E2" stroke-width="40" stroke-linecap="round"/>
    <!-- Bottom-left green arc -->
    <path d="M -300 0 A 300 300 0 0 0 -3 300" fill="none" stroke="#2ECC71" stroke-width="40" stroke-linecap="round"/>
    <!-- Bottom-right green arc -->
    <path d="M 3 300 A 300 300 0 0 0 300 0" fill="none" stroke="#2ECC71" stroke-width="40" stroke-linecap="round"/>
    <!-- Central sprout (lightning-bolt-like stylized leaf, pointing up via thin top) -->
    <path d="M 0 -340 L 110 0 L 50 30 L 0 0 L -50 30 L -110 0 Z" fill="#2ECC71"/>
  </g>
</svg>
