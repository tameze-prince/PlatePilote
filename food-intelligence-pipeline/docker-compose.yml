version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: plateplate-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: plateplate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - plateplate-network

  redis:
    image: redis:7-alpine
    container_name: plateplate-redis
    ports:
      - "6379:6379"
    networks:
      - plateplate-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: plateplate-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - plateplate-network

  prometheus:
    image: prom/prometheus:latest
    container_name: plateplate-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - plateplate-network

  grafana:
    image: grafana/grafana:latest
    container_name: plateplate-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - plateplate-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  plateplate-network:
    driver: bridge
