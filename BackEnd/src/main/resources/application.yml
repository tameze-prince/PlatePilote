# PLATEPILOTE APPLICATION CONFIGURATION
# =======================================
# 
# This file configures how the application connects to databases,
# handles security, and exposes API endpoints.
# 
# Environment variables (like ${DB_USERNAME}) can be overridden:
# - Windows: set DB_USERNAME=myuser
# - Or in IDE run configurations

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: platepilote-backend

  # ==========================================
  # DATABASE CONFIGURATION (PostgreSQL)
  # ==========================================
  # Laragon default: localhost:5432, postgres/postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/platepilote
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20    # Max connections to database (increased from 10 for concurrent load)
      minimum-idle: 5          # Min connections kept alive
      idle-timeout: 300000     # Close idle connections after 5min (was 30s, too aggressive)
      connection-timeout: 20000 # Wait max 20s for connection
      max-lifetime: 1200000    # Max connection lifetime: 20min (prevents stale connections)

  # ==========================================
  # JPA / HIBERNATE CONFIGURATION
  # ==========================================
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # update = Hibernate auto-adds missing columns/tables (Flyway manages initial schema)
      # validate = strict check (fails if schema doesn't match entities)
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_schema: public
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
        jakarta:
          cache:
            missing_cache_strategy: create
            provider: org.ehcache.jsr107.EhcacheCachingProvider
            uri: classpath:ehcache.xml

  # ==========================================
  # FLYWAY - DATABASE MIGRATIONS
  # ==========================================
  # Flyway runs SQL files in db/migration/ to create/update tables
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ==========================================
  # REDIS CONFIGURATION (Cache)
  # ==========================================
  # Laragon default: localhost:6379, no password
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 6000ms

  cache:
    type: ${CACHE_TYPE:none}
    redis:
      time-to-live: 600000  # Cache expires after 10 minutes

  # ==========================================
  # EMAIL CONFIGURATION (Optional)
  # ==========================================
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${BREVO_SMTP_USERNAME:${MAIL_USERNAME:}}
    password: ${BREVO_SMTP_KEY:${MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

  # ==========================================
  # JSON SERIALIZATION
  # ==========================================
  jackson:
    serialization:
      write-dates-as-timestamps: false  # Use ISO-8601 format for dates
    default-property-inclusion: non_null # Don't include null fields in JSON

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server:
  port: 8081
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024
  error:
    include-message: always
    include-binding-errors: always

# ==========================================
# APPLICATION-SPECIFIC SETTINGS
# ==========================================
app:
  api:
    usda-key: ${USDA_API_KEY:}
    themealdb-key: ${THEMEALDB_API_KEY:1}
    edamam-app-id: ${EDAMAM_APP_ID:}
    edamam-app-key: ${EDAMAM_APP_KEY:}
    spoonacular-key: ${SPOONACULAR_API_KEY:}
    nutritionix-app-id: ${NUTRITIONIX_APP_ID:}
    nutritionix-app-key: ${NUTRITIONIX_APP_KEY:}
    upcitemdb-key: ${UPCITEMDB_API_KEY:}
    barcode-lookup-key: ${BARCODE_LOOKUP_API_KEY:}
  jwt:
    # Secret key for signing JWT tokens (Base64 encoded)
    # CHANGE THIS IN PRODUCTION to a long random string!
    secret: ${JWT_SECRET:Y2hhbmdlLXRoaXMtdG8tYS1sb25nLXNlY3VyZS1rZXktaW4tcHJvZHVjdGlvbi1lbnZpcm9ubWVudC1wbGVhc2U=}
    expiration: ${JWT_EXPIRATION:3600000}       # Access token: 1 hour
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # Refresh token: 7 days
  oauth2:
    google:
      client-ids: ${GOOGLE_OAUTH_CLIENT_IDS:}
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      issuers:
        - https://accounts.google.com
        - accounts.google.com
    apple:
      client-ids: ${APPLE_OAUTH_CLIENT_IDS:}
      jwk-set-uri: https://appleid.apple.com/auth/keys
      issuers:
        - https://appleid.apple.com
  email:
    verification:
      from: ${EMAIL_VERIFICATION_FROM:PlatePilote <no-reply@platepilote.com>}
      frontend-url: ${EMAIL_VERIFICATION_URL:http://localhost:3000/verify-email}
      expiration-hours: ${EMAIL_VERIFICATION_EXPIRATION_HOURS:24}
      fail-on-send-error: ${EMAIL_VERIFICATION_FAIL_ON_SEND_ERROR:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:59043,http://localhost:8081,http://localhost:*}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-Requested-With,Accept
    max-age: 3600
  billing:
    free-trial-days: ${BILLING_FREE_TRIAL_DAYS:30}
    past-due-grace-days: ${BILLING_PAST_DUE_GRACE_DAYS:3}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      monthly-price-id: ${STRIPE_PRICE_MONTHLY:}
      yearly-price-id: ${STRIPE_PRICE_YEARLY:}
      success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/billing/success}
      cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/billing/cancel}
      portal-return-url: ${STRIPE_PORTAL_RETURN_URL:http://localhost:3000/settings/billing}

# ==========================================
# ACTUATOR - HEALTH CHECKS & METRICS
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# ==========================================
# LOGGING
# ==========================================
logging:
  level:
    com.platepilote: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
