# PLATEPILOTE APPLICATION CONFIGURATION
# =======================================
# 
# This file configures how the application connects to databases,
# handles security, and exposes API endpoints.
# 
# Environment variables (like ${DB_USERNAME}) can be overridden:
# - Windows: set DB_USERNAME=myuser
# - Or in IDE run configurations

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: platepilote-backend

  # ==========================================
  # DATABASE CONFIGURATION (PostgreSQL)
  # ==========================================
  # Laragon default: localhost:5432, postgres/postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/platepilote}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10    # Neon free tier: 10 connections max
      minimum-idle: 2          # Min connections kept alive
      idle-timeout: 300000     # Close idle connections after 5min
      connection-timeout: 30000 # Wait max 30s for connection (Neon cold start)
      max-lifetime: 600000     # Max connection lifetime: 10min (Neon recycles connections)
      connection-test-query: SELECT 1
      transaction-isolation: TRANSACTION_READ_COMMITTED
      data-source-properties:
        ApplicationName: PlatePilote

  # ==========================================
  # JPA / HIBERNATE CONFIGURATION
  # ==========================================
  jpa:
      database-platform: ${HIBERNATE_DIALECT:}
      hibernate:
        # update = Hibernate auto-adds missing columns/tables (Flyway manages initial schema)
        ddl-auto: update
      show-sql: false
      open-in-view: false
      properties:
        hibernate:
          format_sql: true
          use_sql_comments: true
          default_schema: public
          cache:
            use_second_level_cache: true
            use_query_cache: true
            region:
              factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
          javax:
            cache:
              missing_cache_strategy: create
              provider: org.ehcache.jsr107.EhcacheCachingProvider
              uri: classpath:ehcache.xml

  # ==========================================
  # FLYWAY - DATABASE MIGRATIONS
  # ==========================================
  # Flyway runs SQL files in db/migration/ to create/update tables
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ==========================================
  # REDIS CONFIGURATION (Cache)
  # ==========================================
  # Laragon default: localhost:6379, no password
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 6000ms

  cache:
    type: ${CACHE_TYPE:none}
    redis:
      time-to-live: 600000  # Cache expires after 10 minutes

  # ==========================================
  # ==========================================
  # EMAIL CONFIGURATION (Optional)
  # ==========================================
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${BREVO_SMTP_USERNAME:${MAIL_USERNAME:}}
    password: ${BREVO_SMTP_KEY:${MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enabled: ${MAIL_SMTP_STARTTLS:true}
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  server:
    port: 8081
    compression:
      enabled: true
      mime-types: application/json,application/xml,text/html,text/plain
      min-response-size: 1024
    error:
      include-message: always
      include-binding-errors: always

# APPLICATION-SPECIFIC SETTINGS
# ==========================================
app:
  ai:
    service-url: ${AI_SERVICE_URL:http://localhost:8086/api/v1/ai}
  api:
    usda-key: ${USDA_API_KEY:}
    themealdb-key: ${THEMEALDB_API_KEY:1}
    edamam-app-id: ${EDAMAM_APP_ID:}
    edamam-app-key: ${EDAMAM_APP_KEY:}
    spoonacular-key: ${SPOONACULAR_API_KEY:}
    nutritionix-app-id: ${NUTRITIONIX_APP_ID:}
    nutritionix-app-key: ${NUTRITIONIX_APP_KEY:}
    upcitemdb-key: ${UPCITEMDB_API_KEY:}
    barcode-lookup-key: ${BARCODE_LOOKUP_API_KEY:}
    chomp-key: ${CHOMP_API_KEY:}
    recipeapi-key: ${RECIPEAPI_API_KEY:}
    serp-api-key: ${SERP_API_KEY:}
  jwt:
    # Secret key for signing JWT tokens (Base64 encoded)
    # CHANGE THIS IN PRODUCTION to a long random string!
    secret: ${JWT_SECRET:Y2hhbmdlLXRoaXMtdG8tYS1sb25nLXNlY3VyZS1rZXktaW4tcHJvZHVjdGlvbi1lbnZpcm9ubWVudC1wbGVhc2U=}
    expiration: ${JWT_EXPIRATION:3600000}       # Access token: 1 hour
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # Refresh token: 7 days
  oauth2:
      google:
        client-id: ${GOOGLE_OAUTH_CLIENT_IDS:}                          # comma-separated
        jwk-set-uri: ${GOOGLE_OAUTH_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
        issuers: ${GOOGLE_OAUTH_ISSUERS:https://accounts.google.com,accounts.google.com}
      apple:
        client-id: ${APPLE_OAUTH_CLIENT_IDS:}                            # comma-separated (Service ID)
        jwk-set-uri: ${APPLE_OAUTH_JWK_SET_URI:https://appleid.apple.com/auth/keys}
        issuers: ${APPLE_OAUTH_ISSUERS:https://appleid.apple.com}
      facebook:
        client-ids: ${FACEBOOK_OAUTH_CLIENT_ID:}
        graph-uri: ${FACEBOOK_OAUTH_GRAPH_URI:https://graph.facebook.com/v19.0}
        app-secret: ${FACEBOOK_OAUTH_CLIENT_SECRET:}
  email:
    verification:
      from: ${EMAIL_VERIFICATION_FROM:PlatePilote <no-reply@platepilote.com>}
      frontend-url: ${EMAIL_VERIFICATION_URL:http://localhost:3000/verify-email}
      expiration-hours: ${EMAIL_VERIFICATION_EXPIRATION_HOURS:24}
      fail-on-send-error: ${EMAIL_VERIFICATION_FAIL_ON_SEND_ERROR:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:59043,http://localhost:8081,http://localhost:*}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-Requested-With,Accept
    max-age: 3600
  billing:
    free-trial-days: ${BILLING_FREE_TRIAL_DAYS:30}
    past-due-grace-days: ${BILLING_PAST_DUE_GRACE_DAYS:3}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      monthly-price-id: ${STRIPE_PRICE_MONTHLY:}
      yearly-price-id: ${STRIPE_PRICE_YEARLY:}
      success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/billing/success}
      cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/billing/cancel}
      portal-return-url: ${STRIPE_PORTAL_RETURN_URL:http://localhost:3000/settings/billing}

# ==========================================
# ACTUATOR - HEALTH CHECKS & METRICS
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# ==========================================
# LOGGING
# ==========================================
logging:
  level:
    com.platepilote: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
