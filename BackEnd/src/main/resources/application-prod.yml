# ══════════════════════════════════════════════════════════════
# PLATEPILOTE — PRODUCTION PROFILE
# ══════════════════════════════════════════════════════════════
# Active via SPRING_PROFILES_ACTIVE=prod
# Overrides application.yml defaults for production.
# ══════════════════════════════════════════════════════════════

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cache:
    type: redis
    redis:
      time-to-live: 600000

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${BREVO_SMTP_USERNAME}
    password: ${BREVO_SMTP_KEY}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          starttls:
            enabled: true

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024
  error:
    include-message: never
    include-binding-errors: never

app:
  storage:
    r2:
      endpoint: ${R2_ENDPOINT}
      region: ${R2_REGION:auto}
      access-key: ${R2_ACCESS_KEY}
      secret-key: ${R2_SECRET_KEY}
      bucket: ${R2_BUCKET:platepilote-images}
      public-url-template: ${R2_PUBLIC_URL_TEMPLATE:https://pub-{hash}.r2.dev}
  rate-limit:
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:100}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-Requested-With,Accept
    max-age: 3600
  billing:
    free-trial-days: ${BILLING_FREE_TRIAL_DAYS:30}
    past-due-grace-days: ${BILLING_PAST_DUE_GRACE_DAYS:3}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET}
      monthly-price-id: ${STRIPE_PRICE_MONTHLY}
      yearly-price-id: ${STRIPE_PRICE_YEARLY}
      success-url: ${STRIPE_SUCCESS_URL:https://platepilote.com/billing/success}
      cancel-url: ${STRIPE_CANCEL_URL:https://platepilote.com/billing/cancel}
      portal-return-url: ${STRIPE_PORTAL_RETURN_URL:https://platepilote.com/settings/billing}

logging:
  level:
    com.platepilote: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN