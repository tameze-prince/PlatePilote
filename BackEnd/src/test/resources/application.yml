# TEST PROFILE CONFIGURATION
# ===========================
# This configuration is used ONLY during tests (mvn test).
# 
# Key differences from main config:
# - Uses H2 in-memory database (no Docker needed)
# - Disables Flyway (tests use ddl-auto: create-drop instead)
# - Uses a test JWT secret
# - No Redis connection required for tests

spring:
  datasource:
    # H2 in-memory database - runs entirely in Java, no external services
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # create-drop: creates tables on test start, drops them on test end
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  # Disable Flyway for tests - JPA ddl-auto handles schema creation
  flyway:
    enabled: false

  data:
    redis:
      # Redis not needed for basic tests
      host: localhost
      port: 6379

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  api:
    usda-key: test-usda-key
    themealdb-key: 1
  jwt:
    # Test-only secret (not secure, but fine for tests)
    secret: dGVzdC1zZWNyZXQta2V5LWZvci1kZXZlbG9wbWVudC1vbmx5LWRvLW5vdC11c2UtaW4tcHJvZA==
    expiration: 3600000
    refresh-expiration: 604800000
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8080
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-Requested-With,Accept
    max-age: 3600

logging:
  level:
    com.platepilote: DEBUG
