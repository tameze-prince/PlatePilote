# TEST PROFILE CONFIGURATION
# ===========================
# This configuration is used ONLY during tests (mvn test).
# 
# Key differences from main config:
# - Uses H2 in-memory database (no Docker needed)
# - Disables Flyway (tests use ddl-auto: create-drop instead)
# - Uses a test JWT secret
# - No Redis connection required for tests

spring:
  datasource:
    # H2 in-memory database - runs entirely in Java, no external services
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # create-drop: creates tables on test start, drops them on test end
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  # Disable Flyway for tests - JPA ddl-auto handles schema creation
  flyway:
    enabled: false

  data:
    redis:
      # Redis not needed for basic tests
      host: localhost
      port: 6379

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  ai:
    service-url: ${AI_SERVICE_URL:http://localhost:8086/api/v1/ai}
  api:
    usda-key: test-usda-key
    themealdb-key: 1
    edamam-app-id: test-edamam-id
    edamam-app-key: test-edamam-key
    spoonacular-key: test-spoonacular-key
    nutritionix-app-id: test-nutritionix-id
    nutritionix-app-key: test-nutritionix-key
    upcitemdb-key: test-upcitemdb-key
    barcode-lookup-key: test-barcode-key
    chomp-key: test-chomp-key
    recipeapi-key: test-recipeapi-key
  jwt:
    # Test-only secret (not secure, but fine for tests)
    secret: dGVzdC1zZWNyZXQta2V5LWZvci1kZXZlbG9wbWVudC1vbmx5LWRvLW5vdC11c2UtaW4tcHJvZA==
    expiration: 3600000
    refresh-expiration: 604800000
  email:
    verification:
      from: PlatePilote <platepilote@gmail.com>
      frontend-url: http://localhost:3000/verify-email
      expiration-hours: 24
  oauth2:
    google:
      client-ids: 741109389853-2568g1o2p5siocg31at1c39ndatuqv53.apps.googleusercontent.com
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      issuers:
        - https://accounts.google.com
        - accounts.google.com
    apple:
      client-ids: test-apple-client
      jwk-set-uri: https://appleid.apple.com/auth/keys
      issuers:
        - https://appleid.apple.com
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8080
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-Requested-With,Accept
    max-age: 3600
  billing:
    free-trial-days: 30
    past-due-grace-days: 3
    stripe:
      secret-key: sk_test_placeholder
      webhook-secret: whsec_placeholder
      monthly-price-id: price_monthly
      yearly-price-id: price_yearly
      success-url: http://localhost:3000/billing/success
      cancel-url: http://localhost:3000/billing/cancel
      portal-return-url: http://localhost:3000/settings/billing

logging:
  level:
    com.platepilote: DEBUG
